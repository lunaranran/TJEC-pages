Object.keys(provs).sort().forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p+"("+provs[p]+")";document.getElementById("provSel").appendChild(o);});
["q","provSel","tiSel","sortSel"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{render();}));
document.querySelectorAll("th[data-k]").forEach(th=>th.addEventListener("click",()=>{state.sort=th.dataset.k;render();}));
/* render table */
function render(){
 let list=CASES.slice();
 if(state.cat)list=list.filter(c=>c.cat===state.cat);
 const q=document.getElementById("q").value.trim();
 if(q)list=list.filter(c=>(c.name+c.rev.join("")).includes(q));
 const pv=document.getElementById("provSel").value;
 if(pv)list=list.filter(c=>c.prov===pv);
 const tv=parseFloat(document.getElementById("tiSel").value);
 if(tv)list=list.filter(c=>c.ti>=tv);
 const s=document.getElementById("sortSel").value;
 const key=s.replace("-",""),desc=s.endsWith("-");
 list.sort((a,b)=>{let x=a[key]??-1,y=b[key]??-1;
  if(typeof x==="string")return desc?y.localeCompare(x):x.localeCompare(y);
  return desc?y-x:x-y;});
 const tb=document.getElementById("tbody");
 tb.innerHTML=list.map(c=>{
  const star=c.score>=80?'<span class="star">⭐</span>':"";
  const main='<tr class="case" data-id="'+c.id+'"><td>'+c.id+'</td><td>'+c.name+star+'</td><td>'+c.prov+"·"+c.city+'</td>'+
   '<td>'+c.ti.toFixed(2)+'</td><td>'+c.bond.toFixed(2)+'</td><td>'+pct(c.bond,c.ti)+'</td>'+
   '<td>'+(c.cov?c.cov.toFixed(2):'<span class="cov-na">—</span>')+'</td><td><b>'+c.score+'</b></td><td class="cov-na">'+(c.dom||"—")+'</td></tr>';
  const det='<tr class="detail" style="display:none"><td colspan="9"><b>主要收益来源：</b>'+
   (c.rev.length?c.rev.map(r=>"▪"+r).join("　"):"—")+'<br><b>状态：</b>'+(c.status||"—")+'</td></tr>';
  return main+det;}).join("");
 document.getElementById("cnt").textContent="共 "+list.length+" 条（点击行展开收益来源）";
 tb.onclick=e=>{const tr=e.target.closest("tr.case");if(!tr)return;
  const d=tr.nextElementSibling;d.style.display=d.style.display==="none"?"":"none";};
}
render();
</script>
</body>
</html>
